<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08080c" media="(prefers-color-scheme: dark)" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("spend-theme-v1") || localStorage.getItem("spend-theme");
          if (!mode) {
            var rawState = localStorage.getItem("spend-v1") || localStorage.getItem("spend-state-v1");
            if (rawState) {
              var parsed = JSON.parse(rawState);
              mode = (parsed && (parsed.themeMode || parsed.theme)) || "auto";
            }
          }
          mode = mode || "auto";
          var dark =
            mode === "dark" ||
            (mode !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var resolved = dark ? "dark" : "light";
          var root = document.documentElement;
          root.dataset.theme = resolved;
          root.setAttribute("data-theme", resolved);
          root.style.colorScheme = resolved;
          root.style.backgroundColor = dark ? "#08080c" : "#f4f3ee";
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Spend" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>Spend — Personal Expense Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
