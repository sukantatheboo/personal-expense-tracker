    <title>Spend — Expense tracker</title>
    <style id="spend-critical-splash-css">
      :root {
        --bg: #f4f3ee;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) {
          --bg: #0e1411;
          color-scheme: dark;
        }
      }
      html[data-theme="dark"] {
        --bg: #0e1411;
        color-scheme: dark;
      }
      html[data-theme="light"] {
        --bg: #f4f3ee;
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
      }
      .sp-root {
        --sp-bg: #0c130f;
        --sp-green: #316c51;
        --sp-ink: #eaf4ed;
        --sp-font: "Outfit", "Nunito Sans", ui-rounded, system-ui, sans-serif;
        --tile: min(96px, 26vw);
        --gap: 16px;
        --sp-shift: calc(var(--tile) * 0.96 + 8px);
        position: fixed;
        inset: -2px;
        z-index: 2147483000;
        width: calc(100vw + 4px);
        height: calc(100dvh + 4px);
        box-shadow: 0 0 0 4px var(--sp-bg);
        display: grid;
        place-items: center;
        background: var(--sp-bg);
        font-family: var(--sp-font);
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        overscroll-behavior: contain;
      }
      #initial-splash {
        z-index: 2147483001;
        transition: opacity 160ms ease-out;
      }
      #initial-splash.sp-handoff {
        opacity: 0;
        pointer-events: none;
      }
      .sp-root[hidden] {
        display: none;
      }
      .sp-stage {
        display: grid;
        place-items: center;
        will-change: transform;
      }
      .sp-lockup {
        display: flex;
        align-items: center;
        column-gap: var(--gap);
      }
      .sp-mark {
        flex: none;
        width: var(--tile);
        height: var(--tile);
        will-change: transform;
        transform: translate3d(var(--sp-shift), 0, 0);
      }
      .sp-tile {
        width: 100%;
        height: 100%;
        background: var(--sp-green);
        border-radius: 25%;
        transform: scale3d(0.07, 0.07, 1);
        will-change: transform;
        backface-visibility: hidden;
      }
      .sp-tile svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .sp-arrow path {
        fill: none;
        stroke: #fff;
        stroke-width: 7.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0;
      }
      .sp-word {
        display: flex;
        white-space: nowrap;
        font-size: calc(var(--tile) * 0.667);
        line-height: 1;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: var(--sp-ink);
      }
      .sp-l {
        display: inline-block;
        opacity: 0;
        will-change: transform, opacity;
      }
      #initial-splash .sp-tile {
        animation: sp-tile-in 800ms both;
      }
      #initial-splash .sp-shaft {
        stroke-dasharray: 45.255;
        animation: sp-shaft-draw 400ms 640ms both;
      }
      #initial-splash .sp-arm {
        stroke-dasharray: 22;
        animation: sp-arm-draw 300ms 980ms both;
      }
      #initial-splash .sp-mark {
        animation: sp-mark-shift 720ms 1340ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #initial-splash .sp-l {
        animation: sp-letter-in 480ms calc(1400ms + var(--i, 0) * 60ms)
          cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes sp-tile-in {
        0% {
          transform: scale3d(0.07, 0.07, 1);
          border-radius: 50%;
          animation-timing-function: cubic-bezier(0.2, 0.8, 0.3, 1);
        }
        20% {
          transform: scale3d(0.07, 0.07, 1);
          border-radius: 50%;
          animation-timing-function: cubic-bezier(0.34, 1.3, 0.64, 1);
        }
        100% {
          transform: scale3d(1, 1, 1);
          border-radius: 25%;
        }
      }
      @keyframes sp-shaft-draw {
        0% {
          stroke-dashoffset: 45.255;
          opacity: 0;
        }
        0.1% {
          stroke-dashoffset: 45.255;
          opacity: 1;
          animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
        }
        100% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
      }
      @keyframes sp-arm-draw {
        0% {
          stroke-dashoffset: 22;
          opacity: 0;
        }
        0.1% {
          stroke-dashoffset: 22;
          opacity: 1;
          animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
        }
        100% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
      }
      @keyframes sp-mark-shift {
        0% {
          transform: translate3d(var(--sp-shift), 0, 0);
        }
        100% {
          transform: translate3d(0, 0, 0);
        }
      }
      @keyframes sp-letter-in {
        0% {
          opacity: 0;
          transform: translate3d(-0.16em, 0, 0);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-splash .sp-tile,
        #initial-splash .sp-shaft,
        #initial-splash .sp-arm,
        #initial-splash .sp-mark,
        #initial-splash .sp-l {
          animation: none !important;
        }
        #initial-splash .sp-mark,
        #initial-splash .sp-tile {
          transform: none;
        }
        #initial-splash .sp-l,
        #initial-splash .sp-arrow path {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="initial-splash" class="sp-root" role="img" aria-label="Spend">
      <div class="sp-stage">
        <div class="sp-lockup">

            <div class="sp-tile">

                <path class="sp-arm" d="M66 34H44" />
                <path class="sp-arm" d="M66 34V56" />
              </svg>
            </div>
          </div>
          <div class="sp-word" aria-hidden="true">
            <span class="sp-l" style="--i: 0">S</span><span class="sp-l" style="--i: 1">p</span><span class="sp-l" style="--i: 2">e</span><span class="sp-l" style="--i: 3">n</span><span class="sp-l" style="--i: 4">d</span>

        </div>
