<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.frankfurter.dev; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self';"
    />
    <meta
      http-equiv="Permissions-Policy"
      content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#f4f3ee"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0e1411"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-title" content="Spend" />
    <meta name="apple-mobile-web-app-title" content="Spend" />
    <meta
      name="description"
      content="Spend is a free, private personal expense tracker. All tracking data is stored locally on device. Not affiliated with or collecting credentials for any financial institution or bank."
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-180.png" />
    <title>Spend — Expense tracker</title>
    <style>
      :root {
        --bg: #f4f3ee;
        --ink: #18201b;
        --mut: #626e66;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) {
          --bg: #0e1411;
          --ink: #f0f3f1;
          --mut: #93a398;
          color-scheme: dark;
        }
      }
      html[data-theme="dark"] {
        --bg: #0e1411;
        --ink: #f0f3f1;
        --mut: #93a398;
        color-scheme: dark;
      }
      html[data-theme="light"] {
        --bg: #f4f3ee;
        --ink: #18201b;
        --mut: #626e66;
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        font-family:
          Manrope,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .spend-splash-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--bg);
        color: var(--ink);
        overflow: hidden;
      }
      .spend-splash-ambient {
        position: absolute;
        width: 380px;
        height: 380px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(47, 122, 90, 0.22) 0%,
          rgba(47, 122, 90, 0.08) 45%,
          transparent 72%
        );
        filter: blur(48px);
        transform: translate3d(0, -20px, 0);
      }
      .spend-splash-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: 100%;
        max-width: 320px;
        padding: 0 24px;
        box-sizing: border-box;
      }
      .spend-splash-badge {
        width: 68px;
        height: 68px;
        border-radius: 20px;
        background: linear-gradient(135deg, #3aa376 0%, #206848 100%);
        color: #ffffff;
        display: grid;
        place-items: center;
        margin-bottom: 28px;
        box-shadow:
          inset 0 1px 1px rgba(255, 255, 255, 0.4),
          0 14px 34px -6px rgba(47, 122, 90, 0.45);
      }
      .spend-splash-badge svg {
        width: 34px;
        height: 34px;
        stroke: #ffffff;
        stroke-width: 4.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .spend-splash-label {
        font-size: 15px;
        font-weight: 600;
        color: var(--mut);
        margin: 0 0 6px 0;
      }
      .spend-splash-amount-row {
        display: inline-flex;
        align-items: baseline;
        font-size: clamp(48px, 13vw, 58px);
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 1.05;
      }
      .spend-splash-currency {
        font-size: 0.88em;
        font-weight: 750;
        margin-right: 1px;
      }
    </style>
    <script>
      // Frame busting / Clickjacking protection
      try {
        if (window.top !== window.self) {
          window.top.location = window.self.location;
        }
      } catch (e) {}
      try {
        var savedTheme = localStorage.getItem("spend-theme-v1");
        var isDark =
          savedTheme === "dark" ||
          (!savedTheme &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = isDark ? "dark" : "light";
        var color = isDark ? "#0e1411" : "#f4f3ee";
        document
          .querySelectorAll('meta[name="theme-color"]')
          .forEach(function (meta) {
            meta.setAttribute("content", color);
          });
      } catch (e) {}
    </script>
  </head>
  <body>
    <input
      id="safari-haptic-trigger"
      type="checkbox"
      switch
      aria-hidden="true"
      tabindex="-1"
      style="position:fixed;opacity:0;pointer-events:none;left:-9999px;width:0;height:0;"
    />
    <div id="root">
      <div class="spend-splash-overlay" aria-hidden="true">
        <div class="spend-splash-ambient"></div>
        <div class="spend-splash-content">
          <div class="spend-splash-icon-wrapper">
            <div class="spend-splash-badge">
              <svg viewBox="0 0 64 64">
                <path d="M22 43 43 22M28 22h15v15" />
              </svg>
            </div>
          </div>
          <div class="spend-splash-text-group">
            <p class="spend-splash-label">Spent this month</p>
            <div class="spend-splash-amount-row">
              <span class="spend-splash-currency">$</span>
              <span class="spend-splash-digits">1,284</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
