<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#f4f3ee"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0e1411"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-title" content="Spend" />
    <meta name="apple-mobile-web-app-title" content="Spend" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-180.png" />
    <title>Spend — Expense tracker</title>
    <style>
      :root {
        --bg: #f4f3ee;
        --sk: #e6e4dc;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) {
          --bg: #0e1411;
          --sk: #26322c;
          color-scheme: dark;
        }
      }
      html[data-theme="dark"] {
        --bg: #0e1411;
        --sk: #26322c;
        color-scheme: dark;
      }
      html[data-theme="light"] {
        --bg: #f4f3ee;
        --sk: #e6e4dc;
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
      }
      .boot {
        min-height: 100dvh;
        box-sizing: border-box;
        padding: calc(env(safe-area-inset-top) + 18px) 16px 0;
        max-width: 480px;
        margin: 0 auto;
      }
      .sk {
        background: var(--sk);
        border-radius: 12px;
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.5;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sk {
          animation: none;
        }
      }
    </style>
    <script>
      try {
        var savedTheme = localStorage.getItem("spend-theme-v1");
        var isDark =
          savedTheme === "dark" ||
          (!savedTheme &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = isDark ? "dark" : "light";
        var color = isDark ? "#0e1411" : "#f4f3ee";
        document
          .querySelectorAll('meta[name="theme-color"]')
          .forEach(function (meta) {
            meta.setAttribute("content", color);
          });
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true">
        <div class="sk" style="width: 120px; height: 28px"></div>
        <div
          class="sk"
          style="height: 150px; border-radius: 24px; margin-top: 20px"
        ></div>
        <div style="display: flex; gap: 12px; margin-top: 12px">
          <div
            class="sk"
            style="flex: 1; height: 84px; border-radius: 20px"
          ></div>
          <div
            class="sk"
            style="flex: 1; height: 84px; border-radius: 20px"
          ></div>
        </div>
        <div
          class="sk"
          style="height: 200px; border-radius: 24px; margin-top: 12px"
        ></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
