<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.frankfurter.dev; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self';"
    />
    <meta
      http-equiv="Permissions-Policy"
      content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#f4f3ee"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0e1411"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-title" content="Spend" />
    <meta name="apple-mobile-web-app-title" content="Spend" />
    <meta
      name="description"
      content="Spend is a free, private personal expense tracker. All tracking data is stored locally on device. Not affiliated with or collecting credentials for any financial institution or bank."
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&display=swap"
    />
    <title>Spend — Expense tracker</title>
    <style>
      :root {
        --bg: #f4f3ee;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) {
          --bg: #0e1411;
          color-scheme: dark;
        }
      }
      html[data-theme="dark"] {
        --bg: #0e1411;
        color-scheme: dark;
      }
      html[data-theme="light"] {
        --bg: #f4f3ee;
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
      }
    </style>
  </head>
  <body>
    <input
      id="safari-haptic-trigger"
      type="checkbox"
      switch
      aria-hidden="true"
      tabindex="-1"
      style="position:fixed;opacity:0;pointer-events:none;left:-9999px;width:0;height:0;"
    />
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
