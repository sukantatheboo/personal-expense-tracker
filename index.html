<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#161d2b" />
    <style id="spend-critical-splash-css">
      html[data-splash-active="1"],
      html[data-splash-active="1"] body {
        background: #161d2b !important;
        background-color: #161d2b !important;
        color-scheme: dark !important;
      }
      #initial-splash {
        position: fixed;
        inset: -4px;
        z-index: 2147483001;
        background: #161d2b;
        box-shadow: 0 0 0 4px #161d2b;
        pointer-events: none;
      }
    </style>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("spend-theme-v1") || localStorage.getItem("spend-theme");
          if (!mode) {
            var rawState = localStorage.getItem("spend-v1") || localStorage.getItem("spend-state-v1");
            if (rawState) {
              var parsed = JSON.parse(rawState);
              mode = (parsed && (parsed.themeMode || parsed.theme)) || "auto";
            }
          }
          mode = mode || "auto";
          var dark =
            mode === "dark" ||
            (mode !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var resolved = dark ? "dark" : "light";
          var splashBg = "#161d2b";
          var root = document.documentElement;
          root.dataset.theme = resolved;
          root.setAttribute("data-theme", resolved);
          root.dataset.splashActive = "1";
          root.style.colorScheme = "dark";
          root.style.backgroundColor = splashBg;

          var ua = (navigator && navigator.userAgent) || "";
          var plat =
            (navigator &&
              ((navigator.userAgentData && navigator.userAgentData.platform) ||
                navigator.platform)) ||
            "";
          var capPlat =
            window.Capacitor && typeof window.Capacitor.getPlatform === "function"
              ? window.Capacitor.getPlatform()
              : "";
          var detectedPlatform =
            capPlat === "android" || capPlat === "ios"
              ? capPlat
              : /android/i.test(ua) || /android/i.test(plat)
                ? "android"
                : /iPhone|iPad|iPod/i.test(ua) ||
                    /iPhone|iPad|iPod/i.test(plat) ||
                    (/Mac/i.test(plat) && navigator.maxTouchPoints > 1)
                  ? "ios"
                  : "web";
          root.dataset.platform = detectedPlatform;
          root.setAttribute("data-platform", detectedPlatform);
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spend" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>Spend — Personal Expense Tracker</title>
  </head>
  <body style="margin: 0; background-color: #161d2b">
    <div id="initial-splash" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
